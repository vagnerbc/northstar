packages:
  - apps/*
  - services/*
  - packages/*
allowBuilds:
  '@confluentinc/kafka-javascript': true
  '@prisma/engines': true
  '@swc/core': true
  cpu-features: false
  esbuild: true
  prisma: true
  protobufjs: true
  ssh2: false
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.10'
  - '@turbo/darwin-arm64@2.10.10'
  - '@turbo/linux-64@2.10.10'
  - '@turbo/linux-arm64@2.10.10'
  - '@turbo/windows-64@2.10.10'
  - '@turbo/windows-arm64@2.10.10'
  - turbo@2.10.10
  - '@hookform/resolvers@5.8.0'
