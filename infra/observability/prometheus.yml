global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: otel-collector
    static_configs: [{ targets: [otel-collector:8889] }]
  - job_name: kong
    metrics_path: /metrics
    static_configs: [{ targets: [kong:8100] }]
  - job_name: keycloak
    metrics_path: /metrics
    static_configs: [{ targets: [keycloak:9000] }]
  - job_name: kafka
    static_configs: [{ targets: [kafka-exporter:9308] }]
  - job_name: postgres
    static_configs: [{ targets: [postgres-exporter:9187] }]
